<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="favStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="favCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#favShield)" stroke="url(#favBorder)" stroke-width="4" />

  <!-- Navigation Compass Ring -->
  <circle cx="50" cy="50" r="38" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5" />

  <!-- 4-Point Star -->
  <path d="M 50 14 L 57 43 L 86 50 L 57 57 L 50 86 L 43 57 L 14 50 L 43 43 Z" fill="url(#favStar)" />

  <!-- Medical Cross -->
  <g transform="translate(50 50)">
    <rect x="-6" y="-18" width="12" height="36" rx="3" fill="url(#favCross)" />
    <rect x="-18" y="-6" width="36" height="12" rx="3" fill="url(#favCross)" />
    <circle cx="0" cy="0" r="4" fill="#0284c7" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>
</svg>
